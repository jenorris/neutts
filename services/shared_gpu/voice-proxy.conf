[Unit]
Requires=neutts-server.service
After=neutts-server.service
PartOf=neutts-server.service

[Service]
WorkingDirectory=%h/Code/neutts/services/shared_gpu
ExecStart=
ExecStart=%h/Code/neutts/.venv/bin/python -m uvicorn proxy:app --host 127.0.0.1 --port 8291
Environment=NEUTTS_UPSTREAM=http://127.0.0.1:8290
Environment=NEUTTS_PROXY_VOICE=secondary
