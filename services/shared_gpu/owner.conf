[Service]
WorkingDirectory=%h/Code/neutts/services/shared_gpu
ExecStart=
ExecStart=%h/Code/neutts/.venv/bin/python -m uvicorn server:app --host 127.0.0.1 --port 8290
Environment=NEUTTS_EXTRA_VOICE=secondary
Environment=NEUTTS_EXTRA_REF_AUDIO=%h/Code/neutts/voices/secondary/ref.wav
Environment=NEUTTS_EXTRA_REF_TEXT=%h/Code/neutts/voices/secondary/ref.txt
Environment=NEUTTS_REFERENCE_CACHE=%h/.cache/neutts/references
